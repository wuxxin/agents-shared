providers:
  webSearchOrder: []
modelRoles:
  default: google-antigravity/gemini-3.6-flash
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 1
statusLine:
  preset: default
  separator: powerline-thin
stt:
  enabled: false
compaction:
  strategy: snapcompact
  thresholdPercent: 85
  handoffSaveToDisk: false
memory:
  backend: hindsight
autolearn:
  enabled: true
hindsight:
  apiUrl: http://localhost:8888
  bankId: omp-orchestrator
  scoping: per-project-tagged
  retainMode: full-session
  autoRecall: true
  autoRetain: true
  mentalModelsEnabled: true
  mentalModelAutoSeed: true
mcpServers:
  sequential-thinking:
    command:
      - bunx
      - "@modelcontextprotocol/server-sequential-thinking"
  arbor:
    command:
      - arbor
      - mcp
  hindsight:
    command:
      - bunx
      - hindsight-mcp
bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: false
shellMinimizer:
  sourceOutlineLevel: default
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
todo:
  remindersMax: 5
computer:
  backend: auto
  display: all
task:
  eager: default
  maxConcurrency: 32
  agentIdleTtlMs: 420000
  prewalk: false
secrets:
  enabled: false
